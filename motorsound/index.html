<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Motorsound</title>
<style>
/* Hochformat: Instrument oben, Bedienung darunter. Querformat und Tablet: nebeneinander. Bewusst nur dunkel, wie ein Cockpit bei Nacht.
   Nur Systemschriften: Im WLAN S3XY_OBD gibt es kein Internet. */
:root {
  --bg: #0b0e12;
  --panel: #151a20;
  --line: #262e37;
  --fg: #eef1f4;
  --muted: #8a94a0;
  --needle: #f2a33a;
  --red: #e5483f;
  --ok: #4cc38a;
  --font-display: -apple-system, "SF Pro Display", system-ui, "Helvetica Neue", Arial, sans-serif;
  --font-body: -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); margin: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
.app { max-width: 1120px; margin: 0 auto; min-height: 100%; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-content: start; }
@media (min-width: 700px) { .app { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; } }
.gauge, .controls { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
canvas#tacho { width: 100%; aspect-ratio: 1.45; display: block; }
.readouts { display: grid; grid-template-columns: 1fr 1fr 1fr; margin-top: -6px; }
.ro { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.ro b { font-family: var(--font-display); font-size: 1.7rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.ro.main b { font-size: 2.6rem; font-weight: 700; line-height: 1; }
.ro span { color: var(--muted); font-size: .72rem; letter-spacing: .04em; }
.readouts { align-items: end; }
.bars { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bar { display: flex; flex-direction: column; gap: 5px; font-size: .72rem; color: var(--muted); letter-spacing: .04em; }
.bar i { display: block; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; position: relative; }
.bar i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--v, 0%); background: var(--c, var(--needle)); border-radius: 3px; }
button { font: inherit; color: var(--fg); cursor: pointer; }
.start { font-size: 1.05rem; font-weight: 600; padding: 15px; border-radius: 14px; border: 1px solid var(--needle); background: var(--needle); color: #1b1206; }
.start.on { background: transparent; color: var(--needle); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; background: var(--panel); border-radius: 11px; padding: 3px; }
.seg button { font-size: .9rem; font-weight: 500; background: transparent; border: 0; border-radius: 8px; padding: 9px 6px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: #2a323c; color: var(--fg); }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.acts button { font-size: .88rem; background: var(--panel); border: 0; border-radius: 10px; padding: 11px 6px; }
.acts button[aria-pressed="true"] { color: var(--needle); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--needle); outline-offset: 2px; }
.card { background: var(--panel); border-radius: 14px; padding: 4px 14px; display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 10px; align-items: center; min-height: 48px; font-size: .92rem; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.stack { display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 0; }
.row .seg { background: var(--bg); }
select, input[type="text"] { font: inherit; font-size: .92rem; color: var(--fg); background: transparent; border: 0; padding: 8px 0; width: 100%; text-align: right; text-align-last: right; min-width: 0; }
select option { color: #000; }
.rng { display: flex; align-items: center; gap: 10px; min-width: 0; }
.rng output { font-size: .82rem; color: var(--muted); min-width: 3.6em; text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--needle); }
details summary { list-style: none; min-height: 48px; display: flex; align-items: center; justify-content: space-between; font-size: .92rem; border-top: 1px solid var(--line); cursor: pointer; }
details summary::-webkit-details-marker { display: none; }
details summary::after { content: "›"; color: var(--muted); font-size: 1.2rem; }
details[open] summary::after { transform: rotate(90deg); }
.pedals { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
.pedal { font-weight: 600; font-size: 1rem; padding: 24px 0; border-radius: 14px; border: 0; background: var(--panel); touch-action: none; }
.pedal.gas.on { background: var(--needle); color: #1b1206; }
.pedal.brk.on { background: var(--red); }
.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.status { font-size: .85rem; color: var(--muted); text-align: center; padding: 2px 8px; }
.status:empty { display: none; }
.status.ok { color: var(--ok); }
.status.err { color: var(--red); }
/* iPhone quer: alles Wichtige ohne Scrollen sichtbar */
@media (orientation: landscape) and (max-height: 500px) {
  .gauge { gap: 8px; }
  canvas#tacho { max-height: 58vh; width: auto; margin: 0 auto; }
  .bars { display: none; }
  .readouts { margin-top: 0; }
  .ro.main b { font-size: 2rem; }
  .ro b { font-size: 1.3rem; }
  .start { padding: 9px; font-size: .95rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main class="app">
  <div class="gauge">
    <canvas id="tacho" width="900" height="620" aria-label="Drehzahlmesser"></canvas>
    <div class="readouts">
      <div class="ro"><b id="roRpm">0</b><span>U/min</span></div>
      <div class="ro main"><b id="roSpeed">0</b><span>km/h</span></div>
      <div class="ro"><b id="roTq">0</b><span>kW</span></div>
    </div>
    <div class="bars">
      <div class="bar">Gas<i id="barPedal"></i></div>
      <div class="bar">Last<i id="barLoad" style="--c: var(--ok)"></i></div>
    </div>
    <button class="start" id="startBtn">Motor starten</button>
  </div>

  <div class="controls">
    <div class="seg" role="group" aria-label="Datenquelle">
      <button id="srcLive" aria-pressed="false">Live</button>
      <button id="srcSim" aria-pressed="true">Simulation</button>
    </div>
    <div class="status" id="status" role="status"></div>
    <div id="panelSim" class="side">
      <div class="pedals">
        <button class="pedal brk" id="brkBtn">Bremse</button>
        <button class="pedal gas" id="gasBtn">Gas</button>
      </div>
      <div class="acts">
        <button id="demoBtn">Demofahrt</button>
        <button id="parkBtn">P / D</button>
      </div>
      <div class="card">
        <label class="row" for="gasSlider">Gas halten <span class="rng"><input type="range" id="gasSlider" min="0" max="100" value="0"><output id="gasOut" for="gasSlider">0 %</output></span></label>
      </div>
    </div>
    <div id="panelLive" class="side" hidden>
      <div class="card" id="bridgeCard">
        <label class="row" for="bridgeUrl">Bridge <input type="text" id="bridgeUrl" value="http://localhost:8787/stream" spellcheck="false"></label>
        <div class="row"><span></span><button id="connectBtn">Verbinden</button></div>
      </div>
    </div>
    <div class="card">
      <label class="row" for="engineSel">Motor <select id="engineSel"></select></label>
      <div class="row stack">Schaltung
        <div class="seg" role="group" aria-label="Schaltung">
          <button data-shift="comfort" aria-pressed="false">Komfort</button>
          <button data-shift="sport" aria-pressed="true">Sport</button>
          <button data-shift="track">Track</button>
        </div>
      </div>
      <label class="row" for="vol">Lautstärke <span class="rng"><input type="range" id="vol" min="0" max="100" value="70"><output id="volOut" for="vol">70 %</output></span></label>
      <details>
        <summary>Erweitert</summary>
        <label class="row" for="tqMax">Volllast ab <span class="rng"><input type="range" id="tqMax" min="50" max="500" step="10" value="140"><output id="tqMaxOut" for="tqMax">140 kW</output></span></label>
      </details>
    </div>
  </div>
</main>

<script>
"use strict";
/* ===================== Sound-Engine (AudioWorklet) =====================
   Prozedural, ohne Samples: Jeder Zylinder erzeugt beim Zünden einen Druckpuls.
   Pulse laufen je Zylinderbank durch ein Abgasrohr (Waveguide mit Rückkopplung),
   dann durch einen lastabhängigen Schalldämpfer-Tiefpass. Ungleichmäßige
   Zündabstände pro Bank (Crossplane-V8, Boxer) ergeben das typische Blubbern. */
const WORKLET_SRC = `
class EngineProc extends AudioWorkletProcessor {
  constructor(opts) {
    super();
    this.sr = sampleRate;
    this.p = { rpm: 0, load: 0, throttle: 0, cut: 0, overrun: 0, gain: 0.7 };
    this.rpm = 0; this.load = 0; this.thr = 0; this.phase = 0;
    this.prof = null;
    this.pulses = []; for (let i = 0; i < 48; i++) this.pulses.push({ on: false, age: 0, amp: 0, bank: 0, pop: 0 });
    this.dl = [new Float32Array(4096), new Float32Array(4096)]; this.dw = 0;
    this.lpLoop = [0, 0]; this.m1 = [0, 0]; this.m2 = [0, 0]; this.dc = [0, 0]; this.dcx = [0, 0];
    this.ib = 0; this.il = 0; this.seed = 22222;
    this.boost = 0; this.tph = 0; this.bov = 0; this.bovLp = 0;
    this.tickEnv = 0; this.tickLp = 0; this.tickPh = 0; this.fc = 0;
    this.port.onmessage = (e) => {
      if (e.data.profile) this.setProfile(e.data.profile);
      if (e.data.state) Object.assign(this.p, e.data.state);
    };
    const po = opts && opts.processorOptions;
    if (po && po.profile) this.setProfile(po.profile);
    if (po && po.state) Object.assign(this.p, po.state);
  }
  rnd() { this.seed = (this.seed * 1664525 + 1013904223) >>> 0; return this.seed / 4294967296; }
  setProfile(pr) {
    this.prof = pr;
    this.cylGain = pr.offsets.map(() => 0.85 + 0.3 * this.rnd());
    if (pr.cylTrim) this.cylGain = pr.cylTrim.slice();   // gemessene Unterschiede zwischen den Zylindern statt Zufall
    const svf = ([f, q, gain, on]) => ({ g: Math.tan(Math.PI * Math.min(f, this.sr * 0.45) / this.sr), k: 1 / q, gain, on: on || 0, s1: 0, s2: 0 });
    this.body = pr.body ? pr.body.map(svf) : null;   // Karosserie-Resonanzen
    this.clack = pr.clack ? pr.clack.map(svf) : null; this.clk = 0;   // Mechanik pro Arbeitstakt (Einspritzung, Ventiltrieb)
    this.ou = [0, 0, 0, 0, 0]; this.ou2 = [0, 0, 0, 0, 0]; this.ou3 = [0, 0, 0, 0, 0];
    // Einzeldrossel-Ansaugung: feste Resonanzen, durch die die Motorordnungen beim Hochdrehen hindurchlaufen
    this.form = pr.itb ? pr.itb.formants.map(([f, q, gain, high]) => ({ g: Math.tan(Math.PI * Math.min(f, this.sr * 0.45) / this.sr), k: 1 / q, gain, high, s1: 0, s2: 0 })) : null;
  }
  spawn(amp, bank, pop) {
    for (const q of this.pulses) if (!q.on) { q.on = true; q.age = 0; q.amp = amp; q.bank = bank; q.pop = pop; return; }
  }
  process(_in, outputs) {
    const out = outputs[0], L = out[0], R = out[1] || out[0];
    const pr = this.prof;
    if (!pr) { L.fill(0); if (R !== L) R.fill(0); return true; }
    const sr = this.sr, p = this.p, n = L.length;
    const kR = 1 - Math.exp(-1 / (0.012 * sr)), kL = 1 - Math.exp(-1 / (0.03 * sr)), kF = 1 - Math.exp(-1 / (0.06 * sr));
    const pipe = [Math.round(pr.pipe[0] * sr / 1000), Math.round(pr.pipe[1] * sr / 1000)];
    const offs = pr.offsets, banks = pr.banks, nc = offs.length;
    for (let i = 0; i < n; i++) {
      this.rpm += (p.rpm - this.rpm) * kR;
      this.load += (p.load - this.load) * kL;
      this.thr += (p.throttle - this.thr) * kL;
      // Schubabschaltung: keine Verbrennung mehr, der Motor pumpt nur noch Luft. Leiser, dumpfer, kaum noch Knallen.
      this.fc += ((p.fc || 0) - this.fc) * kF;
      const rpm = Math.max(this.rpm, 1), load = this.load;
      const prev = this.phase;
      // Lebendigkeit: langsam und schnell schwankende Pegel je Klanganteil, dazu kleine Drehzahlschwankung (Rauschprozesse)
      let mE = 1, mB = 1, mI = 1, wob = 1;
      if (pr.live) {
        const lv = pr.live, ou = this.ou, df = 1 / (lv.fastTau * sr), ds = 1 / (lv.slowTau * sr), nf = Math.sqrt(6 * df), ns = Math.sqrt(6 * ds);
        ou[0] += (this.rnd() * 2 - 1) * nf - ou[0] * df; ou[1] += (this.rnd() * 2 - 1) * nf - ou[1] * df; ou[2] += (this.rnd() * 2 - 1) * nf - ou[2] * df;
        ou[3] += (this.rnd() * 2 - 1) * ns - ou[3] * ds; ou[4] += (this.rnd() * 2 - 1) * ns - ou[4] * ds;
        // Zweimal nachglätten: Ungefilterte Schwankung enthält hohe Frequenzen und macht aus jedem Motorton ein papierartiges Rauschen
        const o2 = this.ou2, o3 = this.ou3;
        for (let j = 0; j < 5; j++) { const dj = j < 3 ? df : ds; o2[j] += (ou[j] - o2[j]) * dj; o3[j] += (o2[j] - o3[j]) * dj; }
        const g = 1.6;   // gleicht die durch das Glätten kleinere Schwankung aus
        mE = Math.max(0.2, 1 + g * (lv.exh[0] * o3[0] + lv.exh[1] * o3[3]));
        mB = Math.max(0.1, 1 + g * (lv.body[0] * o3[1] + lv.body[1] * o3[4]));
        mI = Math.max(0.1, 1 + g * (lv.itb[0] * o3[2] + lv.itb[1] * o3[3]));
        wob = 1 + lv.rpm * o3[4];
      }
      this.phase += rpm * wob / 120 / sr;
      const wrapped = this.phase >= 1; if (wrapped) this.phase -= 1;
      for (let c = 0; c < nc; c++) {
        const o = offs[c];
        const crossed = wrapped ? (o > prev || o <= this.phase) : (o > prev && o <= this.phase);
        if (!crossed) continue;
        if (p.cut > 0.5) { if (this.rnd() < (pr.cutPop === undefined ? 0.18 : pr.cutPop)) this.spawn(0.9 + this.rnd(), banks[c], 1); continue; }
        const lope = pr.lope * (1 - load) * (rpm < 1400 ? 1 : 0.3);
        // Schub ist leiser als Zug, aber nicht stumm: Grundpegel steigt mit der Drehzahl
        const base = 0.28 + 0.4 * Math.min(1, rpm / 4500);
        const cg = pr.trimLoad ? 1 + (this.cylGain[c] - 1) * (0.25 + 0.75 * load) : this.cylGain[c];   // Unterschiede zwischen den Zylindern wachsen mit der Last
        let a = (base + (1 - base) * load) * cg * (1 + (this.rnd() - 0.5) * (0.1 + lope));
        a *= 1 - 0.3 * this.fc;
        if (pr.bankGain) a *= pr.bankGain[banks[c]];       // Bänke klingen verschieden: erzeugt die halbe Zündfrequenz
        this.spawn(a, banks[c], 0);
        if (this.clack) this.clk = cg;
        if (p.overrun > 0 && this.rnd() < 0.05 * p.overrun * pr.crackle * (1 - 0.5 * this.fc)) this.spawn(0.6 + 1.4 * this.rnd(), banks[c], 1);
      }
      const tau = pr.tau / 1000 * (0.55 + 0.45 * Math.min(1, 1200 / rpm));
      let x0 = 0, x1 = 0;
      for (const q of this.pulses) {
        if (!q.on) continue;
        const t = q.age / sr; q.age++;
        const u = t / tau;
        let v;
        if (q.pop) { v = q.amp * (this.rnd() * 2 - 1) * Math.exp(-t / 0.004) * 1.4; if (t > 0.03) q.on = false; }
        else {
          const body = u * Math.exp(1 - u);
          const nz = (this.rnd() * 2 - 1) * Math.exp(-u * 1.6) * pr.noise * (0.35 + load) * (1 - 0.6 * this.fc);
          v = q.amp * (body + nz);
          if (u > 9) q.on = false;
        }
        if (q.bank) x1 += v; else x0 += v;
      }
      const ys = [0, 0], xs = [x0, x1];
      const w = this.dw;
      for (let b = 0; b < 2; b++) {
        const d = this.dl[b];
        const rd = d[(w - pipe[b] + 4096) & 4095];
        this.lpLoop[b] += (rd - this.lpLoop[b]) * pr.loopDamp;
        const y = xs[b] + pr.fb * this.lpLoop[b];
        d[w] = y;
        // Abgasklappe (nur Profile mit flap): zu = dumpfer, öffnet mit Drehzahl oder bei hoher Last
        const flap = pr.flap ? 0.55 + 0.45 * Math.max(Math.min(1, Math.max(0, (rpm - pr.flap[0]) / (pr.flap[1] - pr.flap[0]))), Math.min(1, Math.max(0, (load - 0.6) / 0.25))) : 1;
        const fc = pr.lp * (0.75 + 0.45 * load) * (0.7 + 0.6 * Math.min(1, rpm / pr.redline)) * flap * (1 - 0.3 * this.fc);
        const a1 = 1 - Math.exp(-2 * Math.PI * fc / sr);
        this.m1[b] += (y - this.m1[b]) * a1; this.m2[b] += (this.m1[b] - this.m2[b]) * a1;
        ys[b] = this.m2[b] * 0.7 + y * pr.raw * flap;
      }
      this.dw = (w + 1) & 4095;
      // Ansaugrauschen: Bandpass-Rauschen, mit Zündfrequenz moduliert, nur bei offener Drossel
      const fI = 500 + rpm * 0.35, g = Math.tan(Math.PI * Math.min(fI, sr * 0.45) / sr), k = 1.2;
      const nzI = this.rnd() * 2 - 1;
      const hp = (nzI - (k + g) * this.ib - this.il) / (1 + g * (g + k));
      const bp = g * hp + this.ib; this.ib = g * hp + bp; const lp = g * bp + this.il; this.il = g * bp + lp;
      const fire = 0.6 + 0.4 * Math.sin(2 * Math.PI * this.phase * nc);
      const intake = bp * this.thr * this.thr * 0.16 * pr.intake * fire;
      // Mechanik: leiser Grundton der Kurbelwelle
      const mech = Math.sin(2 * Math.PI * this.phase * nc * 0.5) * 0.03;
      // Turbolader: Ladedruck baut sich mit Last verzögert auf, Pfeifen steigt mit Drehzahl und Druck,
      // beim Gaswegnehmen unter Druck bläst das Schubumluftventil ab
      let turbo = 0;
      if (pr.turbo) {
        const want = load > 0.25 ? Math.min(1, (load - 0.25) / 0.6) * Math.min(1, rpm / 3000) : 0;
        const prevBoost = this.boost;
        this.boost += (want - this.boost) * (want > this.boost ? 1 / (0.7 * sr) : 1 / (0.12 * sr));
        if (prevBoost > 0.45 && load < 0.08 && this.bov <= 0.01) this.bov = prevBoost;
        this.tph += (1800 + 5200 * this.boost + rpm * 0.35) / sr; this.tph -= Math.floor(this.tph);
        const whistle = Math.sin(2 * Math.PI * this.tph) * this.boost * this.boost * 0.035 * (pr.whistle === undefined ? 1 : pr.whistle);
        const nb = this.rnd() * 2 - 1; this.bovLp += (nb - this.bovLp) * 0.35;
        const pssh = (nb - this.bovLp) * this.bov * 0.22;
        this.bov *= Math.exp(-1 / (0.35 * sr));
        turbo = (whistle + pssh) * pr.turbo;
      }
      // Sauger mit Einzeldrosseln: pro Ansaugtakt ein Luftpuls, der die Ansaugresonanzen anregt. Die Luftmasse wächst mit
      // Drehzahl und Drosselöffnung, deshalb wird das Ansaugen oben herum zum dominierenden, metallischen Anteil.
      let itb = 0;
      if (this.form) {
        const it = pr.itb, ph = (this.phase * nc + 0.5) % 1, rn = Math.min(1.05, rpm / pr.redline);
        const c = Math.floor(this.phase * nc) % nc;
        const w = ph < it.duty ? (0.5 - 0.5 * Math.cos(2 * Math.PI * ph / it.duty)) * this.cylGain[c] : 0;
        const flow = (it.floor + (1 - it.floor) * this.thr * Math.sqrt(this.thr)) * rn * rn;
        const x = w * flow * (1 + (this.rnd() - 0.5) * it.jitter);
        const hs = Math.min(1, Math.max(0, (rpm - it.stage[0]) / (it.stage[1] - it.stage[0]))), high = hs * hs * (3 - 2 * hs);
        for (const f of this.form) {
          const h = (x - (f.k + f.g) * f.s1 - f.s2) / (1 + f.g * (f.g + f.k));
          const b = f.g * h + f.s1; f.s1 = f.g * h + b; f.s2 += 2 * f.g * b;
          itb += b * f.gain * (1 + f.high * high);
        }
        itb *= it.gain * mI;
        // Ventiltrieb (Schlepphebel ohne Hydraulik): helles Ticken, zwei Ventilereignisse pro Zündabstand
        const tp = this.phase * nc * 2 % 1;
        if (tp < this.tickPh) this.tickEnv = 0.7 + 0.6 * this.rnd();
        this.tickPh = tp;
        this.tickEnv *= it.tickDecay;
        const nt = this.rnd() * 2 - 1; this.tickLp += (nt - this.tickLp) * 0.55;
        itb += (nt - this.tickLp) * this.tickEnv * it.tick;
      }
      // Brummen: Karosserie und Abgasanlage verstärken die tiefen Motorordnungen, sobald sie durch ihre Resonanzen laufen
      let body = 0;
      if (this.body) {

const $ = id => document.getElementById(id);
let last = performance.now();
function tick() {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (source === "sim") simStep(dt);
  // Reißt die Verbindung im Live-Betrieb ab, darf der Motor nicht mit dem letzten Pedalwert weiterlaufen
  if (source === "live" && now - lastBridgeRx > BRIDGE_GAP) { car.pedal = 0; car.powerKw = 0; car.brake = 0; car.speed = 0; }
  const st = engineStep(dt, now);
  if (node) node.port.postMessage({ state: { ...st, gain: volEl.value / 100 } });
  if (source === "live") liveStatus(now);
  const driving = car.gear === "D" || car.gear === "R";
  const gearLabel = !driving ? car.gear : car.gear === "R" ? "R" : String(eng.gear);
  drawTacho(st.rpm, gearLabel, eng.limiter);
  $("roRpm").textContent = Math.round(st.rpm / 10) * 10;
  $("roSpeed").textContent = Math.round(car.speed);
  $("roTq").textContent = Math.round(car.powerKw);
  $("barPedal").style.setProperty("--v", (car.pedal * 100).toFixed(0) + "%");
  $("barLoad").style.setProperty("--v", (st.load * 100).toFixed(0) + "%");
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
